[workspace]
resolver = "2"
members = [
    "projects/diffuser-edit",
    "projects/diffuser-exif",
    "projects/diffusion-types",
    "projects/diffusion-models",
    "projects/diffusion-registry",
    "projects/diffusion-extensions",
    "projects/diffusion-tools",
    "projects/diffusion-server",
]
default-members = [
    "projects/diffuser-edit",
]
exclude = [
    "projects/.DS_Store",
]

[workspace.dependencies]
candle-core = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
image = { version = "0.25.1", features = ["png", "jpeg"] }
tracing = "0.1"

[profile.release]
lto = true
panic = "abort"
